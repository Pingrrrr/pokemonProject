<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        /* Custom CSS for centering the form */
        body, html {
            height: 100%;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>

<body>

    <div class="container">
        <!--marg 5-->
        <div class="mt-5">
            <!-- Login Form -->
            <form> <!--Start of login form-->
                <!--The for attribute in the this tag is a link. It tells the label which input element it's associated with. -->
                <div class="form-group row">
                    <label for="inputEmail" class="col-md-3 col-form-label">Email</label>
                    <div class="col-md-9">
                        <input type="email" id="inputEmail" class="form-control" aria-describedby="emailHelpInline"
                            placeholder="Enter your email">
                    </div>
                </div>
                <!--Bootstraps combo for forming elements together and create a horizontal layout for the form fields-->
                <div class="form-group row">
                    <label for="inputPassword" 
                     class="col-md-3 col-form-label">Password</label>
                     <!--column, medium + large screens and 9/12-->
                    <div class="col-md-9">
                        <input type="password" id="inputPassword" class="form-control"
                            aria-describedby="passwordHelpInline" placeholder="Enter your password">
                    </div>
                </div>

                <!-- Sign-in Button -->
                <div class="form-group row">
                    <!--takes up space = 3/12 to help positioning and alignment-->
                    <div class="col-md-3"></div>
                    <div class="col-md-9"> <!--Margin top 3 spacing-->
                        <button type="submit" class="btn btn-primary btn-block mt-3">Sign In</button> <!--button has the primary Bootstrap button style,-->
                    </div>
                </div>
            </form>
        </div>
    </div>

    <!-- Bootstrap JavaScript -->
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.bundle.min.js"></script>
</body>

</html>
