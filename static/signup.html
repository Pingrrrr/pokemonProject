<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <!-- my CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container"> <!-- marg bottom 4-->
        <h2 class="text-center mb-4">Sign Up</h2>
        <form>
            <div class="form-group">
                <label for="fullName">User Name</label> <!--bootstrap form-control for styling forms uniformly-->
                <input type="text" class="form-control" id="fullName" placeholder="Enter your username">
            </div>
            <div class="form-group">
                <label for="email">Email address</label>
                <input type="email" class="form-control" id="email" placeholder="Enter your email">
            </div> <!--form group for bootstrap styling and layout-->
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" class="form-control" id="password" placeholder="Enter your password">
            </div>
            <!--checkbox for t&C-->
            <div class="form-group form-check">
                <input type="checkbox" class="form-check-input" id="termsCheck">
                <label class="form-check-label" for="termsCheck">I agree to the terms and conditions</label>
            </div> <!--primary action button to strech across container-->
            <button type="submit" class="btn btn-primary btn-block">Sign Up</button>
        </form>
    </div>
    <!-- Bootstrap JS -->
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.bundle.min.js"></script>
</body>
</html>
